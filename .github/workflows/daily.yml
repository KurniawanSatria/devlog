name: Daily Dev Log

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update daily log
        run: |
          mkdir -p daily
          date=$(date -u +"%Y-%m-%d")
          printf "# %s\n\nDaily development activity.\n" "$date" > "daily/$date.md"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/
          git diff --cached --quiet || git commit -m "docs: daily development log"
          git push
